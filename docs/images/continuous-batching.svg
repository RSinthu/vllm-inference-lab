/><text x="229.0" y="254.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S3</text><rect x="257.5" y="231.5" width="51" height="37" rx="5" fill="#F87171" stroke="#FFFFFF" stroke-width="1" /><text x="283.0" y="254.5" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">END</text><rect x="311.5" y="231.5" width="51" height="37" rx="5" fill="url(#hatch)" stroke="#FFFFFF" stroke-width="1" /><rect x="365.5" y="231.5" width="51" height="37" rx="5" fill="url(#hatch)" stroke="#FFFFFF" stroke-width="1" /><rect x="419.5" y="231.5" width="51" height="37" rx="5" fill="url(#hatch)" stroke="#FFFFFF" stroke-width="1" /><rect x="41.5" y="271.5" width="51" height="37" rx="5" fill="#FCD34D" stroke="#FFFFFF" stroke-width="1" /><text x="67.0" y="294.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S4</text><rect x="95.5" y="271.5" width="51" height="37" rx="5" fill="#FCD34D" stroke="#FFFFFF" stroke-width="1" /><text x="121.0" y="294.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S4</text><rect x="149.5" y="271.5" width="51" height="37" rx="5" fill="#FCD34D" stroke="#FFFFFF" stroke-width="1" /><text x="175.0" y="294.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S4</text><rect x="203.5" y="271.5" width="51" height="37" rx="5" fill="#FCD34D" stroke="#FFFFFF" stroke-width="1" /><text x="229.0" y="294.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S4</text><rect x="257.5" y="271.5" width="51" height="37" rx="5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="1" /><text x="283.0" y="294.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S4</text><rect x="311.5" y="271.5" width="51" height="37" rx="5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="1" /><text x="337.0" y="294.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S4</text><rect x="365.5" y="271.5" width="51" height="37" rx="5" fill="#F87171" stroke="#FFFFFF" stroke-width="1" /><text x="391.0" y="294.5" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">END</text><rect x="419.5" y="271.5" width="51" height="37" rx="5" fill="url(#hatch)" stroke="#FFFFFF" stroke-width="1" /><text x="40" y="338" font-size="12.5" font-weight="normal" text-anchor="start" fill="#475569">Finished slots stay idle until the longest</text><text x="40" y="355" font-size="12.5" font-weight="normal" text-anchor="start" fill="#475569">request (S2) ends at T8.</text><text x="530" y="100" font-size="16" font-weight="bold" text-anchor="start" fill="#DC2626">Continuous batching</text><text x="530" y="120" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">Used by vLLM for LLMs</text><text x="557.0" y="142" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">T1</text><text x="611.0" y="142" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">T2</text><text x="665.0" y="142" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">T3</text><text x="719.0" y="142" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">T4</text><text x="773.0" y="142" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">T5</text><text x="827.0" y="142" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">T6</text><text x="881.0" y="142" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">T7</text><text x="935.0" y="142" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">T8</text><rect x="531.5" y="151.5" width="51" height="37" rx="5" fill="#FCD34D" stroke="#FFFFFF" stroke-width="1" /><text x="557.0" y="174.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S1</text><rect x="585.5" y="151.5" width="51" height="37" rx="5" fill="#FCD34D" stroke="#FFFFFF" stroke-width="1" /><text x="611.0" y="174.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S1</text><rect x="639.5" y="151.5" width="51" height="37" rx="5" fill="#FCD34D" stroke="#FFFFFF" stroke-width="1" /><text x="665.0" y="174.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S1</text><rect x="693.5" y="151.5" width="51" height="37" rx="5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="1" /><text x="719.0" y="174.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S1</text><rect x="747.5" y="151.5" width="51" height="37" rx="5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="1" /><text x="773.0" y="174.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S1</text><rect x="801.5" y="151.5" width="51" height="37" rx="5" fill="#F87171" stroke="#FFFFFF" stroke-width="1" /><text x="827.0" y="174.5" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">END</text><rect x="855.5" y="151.5" width="51" height="37" rx="5" fill="#FCD34D" stroke="#047857" stroke-width="3" /><text x="881.0" y="174.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S6</text><rect x="909.5" y="151.5" width="51" height="37" rx="5" fill="#FCD34D" stroke="#047857" stroke-width="3" /><text x="935.0" y="174.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S6</text><rect x="531.5" y="191.5" width="51" height="37" rx="5" fill="#FCD34D" stroke="#FFFFFF" stroke-width="1" /><text x="557.0" y="214.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S2</text><rect x="585.5" y="191.5" width="51" height="37" rx="5" fill="#FCD34D" stroke="#FFFFFF" stroke-width="1" /><text x="611.0" y="214.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S2</text><rect x="639.5" y="191.5" width="51" height="37" rx="5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="1" /><text x="665.0" y="214.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S2</text><rect x="693.5" y="191.5" width="51" height="37" rx="5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="1" /><text x="719.0" y="214.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S2</text><rect x="747.5" y="191.5" width="51" height="37" rx="5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="1" /><text x="773.0" y="214.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S2</text><rect x="801.5" y="191.5" width="51" height="37" rx="5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="1" /><text x="827.0" y="214.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S2</text><rect x="855.5" y="191.5" width="51" height="37" rx="5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="1" /><text x="881.0" y="214.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S2</text><rect x="909.5" y="191.5" width="51" height="37" rx="5" fill="#F87171" stroke="#FFFFFF" stroke-width="1" /><text x="935.0" y="214.5" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">END</text><rect x="531.5" y="231.5" width="51" height="37" rx="5" fill="#FCD34D" stroke="#FFFFFF" stroke-width="1" /><text x="557.0" y="254.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S3</text><rect x="585.5" y="231.5" width="51" height="37" rx="5" fill="#FCD34D" stroke="#FFFFFF" stroke-width="1" /><text x="611.0" y="254.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S3</text><rect x="639.5" y="231.5" width="51" height="37" rx="5" fill="#FCD34D" stroke="#FFFFFF" stroke-width="1" /><text x="665.0" y="254.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S3</text><rect x="693.5" y="231.5" width="51" height="37" rx="5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="1" /><text x="719.0" y="254.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S3</text><rect x="747.5" y="231.5" width="51" height="37" rx="5" fill="#F87171" stroke="#FFFFFF" stroke-width="1" /><text x="773.0" y="254.5" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">END</text><rect x="801.5" y="231.5" width="51" height="37" rx="5" fill="#FCD34D" stroke="#047857" stroke-width="3" /><text x="827.0" y="254.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S5</text><rect x="855.5" y="231.5" width="51" height="37" rx="5" fill="#FCD34D" stroke="#047857" stroke-width="3" /><text x="881.0" y="254.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S5</text><rect x="909.5" y="231.5" width="51" height="37" rx="5" fill="#60A5FA" stroke="#047857" stroke-width="3" /><text x="935.0" y="254.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S5</text><rect x="531.5" y="271.5" width="51" height="37" rx="5" fill="#FCD34D" stroke="#FFFFFF" stroke-width="1" /><text x="557.0" y="294.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S4</text><rect x="585.5" y="271.5" width="51" height="37" rx="5" fill="#FCD34D" stroke="#FFFFFF" stroke-width="1" /><text x="611.0" y="294.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S4</text><rect x="639.5" y="271.5" width="51" height="37" rx="5" fill="#FCD34D" stroke="#FFFFFF" stroke-width="1" /><text x="665.0" y="294.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S4</text><rect x="693.5" y="271.5" width="51" height="37" rx="5" fill="#FCD34D" stroke="#FFFFFF" stroke-width="1" /><text x="719.0" y="294.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S4</text><rect x="747.5" y="271.5" width="51" height="37" rx="5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="1" /><text x="773.0" y="294.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S4</text><rect x="801.5" y="271.5" width="51" height="37" rx="5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="1" /><text x="827.0" y="294.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S4</text><rect x="855.5" y="271.5" width="51" height="37" rx="5" fill="#F87171" stroke="#FFFFFF" stroke-width="1" /><text x="881.0" y="294.5" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">END</text><rect x="909.5" y="271.5" width="51" height="37" rx="5" fill="#FCD34D" stroke="#047857" stroke-width="3" /><text x="935.0" y="294.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A">S7</text><text x="530" y="338" font-size="12.5" font-weight="normal" text-anchor="start" fill="#475569">The scheduler works per token step: when a request</text><text x="530" y="355" font-size="12.5" font-weight="normal" text-anchor="start" fill="#475569">ends, a waiting request (S5, S6, S7) takes its slot.</text><rect x="120" y="399" width="16" height="14" rx="3" fill="#FCD34D" stroke="none" stroke-width="1" /><text x="142" y="410" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">Prompt (prefill)</text><rect x="279.6" y="399" width="16" height="14" rx="3" fill="#60A5FA" stroke="none" stroke-width="1" /><text x="301.6" y="410" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">Generated token</text><rect x="432.6" y="399" width="16" height="14" rx="3" fill="#F87171" stroke="none" stroke-width="1" /><text x="454.6" y="410" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">Request finished</text><rect x="592.2" y="399" width="16" height="14" rx="3" fill="url(#hatch)" stroke="#CBD5E1" stroke-width="1.5" /><text x="614.2" y="410" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">Idle GPU slot</text><rect x="732.0" y="399" width="16" height="14" rx="3" fill="#FFFFFF" stroke="#047857" stroke-width="1.5" /><text x="754.0" y="410" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">New request joins</text></svg>
