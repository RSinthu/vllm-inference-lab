<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow-0F172A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#F8FAFC"/><line x1="0" y1="0" x2="0" y2="8" stroke="#CBD5E1" stroke-width="3"/></pattern></defs><rect width="1000" height="440" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><text x="500" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#0F172A">Static batching vs continuous batching</text><text x="500" y="58" font-size="13" font-weight="normal" text-anchor="middle" fill="#475569">4 GPU batch slots, 8 generation steps (T1 to T8). Each cell is one token step for one request.</text><text x="40" y="100" font-size="16" font-weight="bold" text-anchor="start" fill="#DC2626">Static batching</text><text x="40" y="120" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">Used for fixed-size models (image classifiers, BERT)</text><text x="67.0" y="142" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">T1</text><text x="121.0" y="142" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">T2</text><text x="175.0" y="142" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">T3</text><text x="229.0" y="142" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">T4</text><text x="283.0" y="142" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">T5</text><text x="337.0" y="142" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">T6</text><text x="391.0" y="142" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">T7</text><text x="445.0" y="142" font-size="12" font-weight="bold"