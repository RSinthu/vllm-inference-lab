<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow-0F172A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#F8FAFC"/><line x1="0" y1="0" x2="0" y2="8" stroke="#CBD5E1" stroke-width="3"/></pattern></defs><rect width="1000" height="330" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><text x="500" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#0F172A">Why KV cache memory was wasted before PagedAttention</text><text x="500" y="58" font-size="13" font-weight="normal" text-anchor="middle" fill="#475569">Older servers reserved one contiguous chunk per request, sized for the maximum length (here 2,048 slots).</text><text x="355.0" y="106" font-size="13" font-weight="bold" text-anchor="middle" fill="#475569">Request A  (2,048 slots reserved)</text><text x="877.0" y="106" font-size="13" font-weight="bold" text-anchor="middle" fill="#475569">Request B</text><rect x="36" y="120" width="58" height="46" rx="0" fill="#FCD34D" stroke="#334155" stroke-width="1" /><text x="65.0" y="147.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#0F172A">Artificial</text><rect x="94" y="120" width="58" height="46" rx="0" fill="#FCD34D" stroke="#334155" stroke-width="1" /><text x="123.0" y="147.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#0F172A">Intelli-</text><rect x="152" y="120" width="58" height="46" rx="0" fill="#FCD34D" stroke="#334155" stroke-width="1" /><text x="181.0" y="147.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#0F172A">is</text><rect x="210" y="120" width="58" height="46" rx="0" fill="#60A5FA" stroke="#334155" stroke-width="1" /><text x="239.0" y="147.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#0F172A">the</text><rect x="268" y="120" width="58" height="46" rx="0" fill="#60A5FA" stroke="#334155" stroke-width="1" /><text x="297.0" y="147.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#0F172A">future</text><rect x="326" y="120" width="58" height="46" rx="0" fill="#BFDBFE" stroke="#334155" stroke-width="1" /><text x="355.0" y="147.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#0F172A"></text><rect x="384" y="120" width="58" height="46" rx="0" fill="#BFDBFE" stroke="#334155" stroke-width="1" /><text x="413.0" y="147.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#0F172A"></text><rect x="442" y="120" width="58" height="46" rx="0" fill="#FECACA" stroke="#334155" stroke-width="1" /><text x="471.0" y="147.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#0F172A">&lt;eos&gt;</text><rect x="500" y="120" width="58" height="46" rx="0" fill="#E5E7EB" stroke="#334155" stroke-width="1" /><text x="529.0" y="147.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#0F172A">&lt;resv&gt;</text><rect x="558" y="120" width="58" height="46" rx="0" fill="#E5E7EB" stroke="#334155" stroke-width="1" /><text x="587.0" y="147.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#0F172A">...</text><rect x="616" y="120" width="58" height="46" rx="0" fill="#E5E7EB" stroke="#334155" stroke-width="1" /><text x="645.0" y="147.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#0F172A">&lt;resv&gt;</text><rect x="674" y="120" width="58" height="46" rx="0" fill="#FFFFFF" stroke="#334155" stroke-width="1" /><text x="703.0" y="147.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#0F172A"></text><rect x="732" y="120" width="58" height="46" rx="0" fill="#FFFFFF" stroke="#334155" stroke-width="1" /><text x="761.0" y="147.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#0F172A"></text><rect x="790" y="120" width="58" height="46" rx="0" fill="#FCD34D" stroke="#334155" stroke-width="1" /><text x="819.0" y="147.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#0F172A">Alan</text><rect x="848" y="120" width="58" height="46" rx="0" fill="#FCD34D" stroke="#334155" stroke-width="1" /><text x="877.0" y="147.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#0F172A">Turing</text><rect x="906" y="120" width="58" height="46" rx="0" fill="#FCD34D" stroke="#334155" stroke-width="1" /><text x="935.0" y="147.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#0F172A">is</text><rect x="674" y="120" width="116" height="46" rx="0" fill="none" stroke="#DC2626" stroke-width="3" /><path d="M40,174 v6 h166 v-6" fill="none" stroke="#92400E" stroke-width="1.5"/><text x="123.0" y="198" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#92400E">3 slots:</text><text x="123.0" y="213" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#92400E">prompt</text><path d="M214,174 v6 h108 v-6" fill="none" stroke="#1E40AF" stroke-width="1.5"/><text x="268.0" y="198" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1E40AF">2 slots:</text><text x="268.0" y="213" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1E40AF">generated</text><text x="268.0" y="228" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1E40AF">so far</text><path d="M330,174 v6 h166 v-6" fill="none" stroke="#1E40AF" stroke-width="1.5"/><text x="413.0" y="198" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1E40AF">3 slots reserved</text><text x="413.0" y="213" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1E40AF">for future tokens</text><path d="M504,174 v6 h166 v-6" fill="none" stroke="#DC2626" stroke-width="1.5"/><text x="587.0" y="198" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#DC2626">2,040 slots reserved</text><text x="587.0" y="213" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#DC2626">but never used:</text><text x="587.0" y="228" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#DC2626">internal fragmentation</text><path d="M678,174 v6 h108 v-6" fill="none" stroke="#DC2626" stroke-width="1.5"/><text x="732.0" y="198" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#DC2626">free, but too small</text><text x="732.0" y="213" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#DC2626">for a new chunk:</text><text x="732.0" y="228" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#DC2626">external fragmentation</text><path d="M794,174 v6 h166 v-6" fill="none" stroke="#92400E" stroke-width="1.5"/><text x="877.0" y="198" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#92400E">next request's</text><text x="877.0" y="213" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#92400E">chunk</text><rect x="110" y="268" width="780" height="40" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" /><text x="500" y="293" font-size="14" font-weight="bold" text-anchor="middle" fill="#DC2626">Result: only 20-40% of KV cache memory held real tokens (Kwon et al., SOSP 2023).</text></svg>
