<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow-0F172A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#F8FAFC"/><line x1="0" y1="0" x2="0" y2="8" stroke="#CBD5E1" stroke-width="3"/></pattern></defs><rect width="1000" height="360" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><text x="500" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#0F172A">Why batching and 8-bit weights make generation faster</text><text x="500" y="58" font-size="13" font-weight="normal" text-anchor="middle" fill="#475569">Every generated token needs one full pass over the model: all weights are read from GPU memory into the compute units.</text><rect x="20" y="80" width="310" height="260" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" /><text x="175" y="106" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#0F172A">1 request</text><rect x="42" y="124" width="92" height="150" rx="6" fill="#60A5FA" stroke="none" stroke-width="1" /><text x="88" y="197.0" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#FFFFFF">BF16 weights</text><text x="88" y="213.0" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#FFFFFF">1.12 GiB</text><text x="88" y="292" font-size="11" font-weight="normal" text-anchor="middle" fill="#475569">GPU memory</text><line x1="140" y1="199" x2="192" y2="199" stroke="#0F172A" stroke-width="2.2" marker-end="url(#arrow-0F172A)"/><text x="166" y="190" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#475569">read</text><rect x="196" y="170" width="56" height="58" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="1" /><text x="224" y="196" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#6366F1">Compute</text><text x="224" y="211" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#6366F1">units</text><line x1="254" y1="199" x2="282" y2="199" stroke="#0F172A" stroke-width="1.4" marker-end="url(#arrow-0F172A)"/><rect x="284" y="188" width="34" height="22" rx="4" fill="#FCD34D" stroke="none" stroke-width="1" /><text x="301" y="203" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0F172A">tok</text><text x="175" y="308" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#475569">The read takes most of the time;</text><text x="175" y="323" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#475569">the math for 1 token is tiny.</text><rect x="345" y="80" width="310" height="260" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" /><text x="500" y="106" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#0F172A">Batch of 4 requests</text><rect x="367" y="124" width="92" height="150" rx="6" fill="#60A5FA" stroke="none" stroke-width="1" /><text x="413" y="197.0" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#FFFFFF">BF16 weights</text><text x="413" y="213.0" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#FFFFFF">1.12 GiB</text><text x="413" y="292" font-size="11" font-weight="normal" text-anchor="middle" fill="#475569">GPU memory</text><line x1="465" y1="199" x2="517" y2="199" stroke="#0F172A" stroke-width="2.2" marker-end="url(#arrow-0F172A)"/><text x="491" y="190" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#475569">read</text><rect x="521" y="170" width="56" height="58" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="1" /><text x="549" y="196" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#6366F1">Compute</text><text x="549" y="211" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#6366F1">units</text><line x1="579" y1="199" x2="607" y2="154" stroke="#0F172A" stroke-width="1.4" marker-end="url(#arrow-0F172A)"/><rect x="609" y="143" width="34" height="22" rx="4" fill="#FCD34D" stroke="none" stroke-width="1" /><text x="626" y="158" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0F172A">tok</text><line x1="579" y1="199" x2="607" y2="184" stroke="#0F172A" stroke-width="1.4" marker-end="url(#arrow-0F172A)"/><rect x="609" y="173" width="34" height="22" rx="4" fill="#FCD34D" stroke="none" stroke-width="1" /><text x="626" y="188" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0F172A">tok</text><line x1="579" y1="199" x2="607" y2="214" stroke="#0F172A" stroke-width="1.4" marker-end="url(#arrow-0F172A)"/><rect x="609" y="203" width="34" height="22" rx="4" fill="#FCD34D" stroke="none" stroke-width="1" /><text x="626" y="218" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0F172A">tok</text><line x1="579" y1="199" x2="607" y2="244" stroke="#0F172A" stroke-width="1.4" marker-end="url(#arrow-0F172A)"/><rect x="609" y="233" width="34" height="22" rx="4" fill="#FCD34D" stroke="none" stroke-width="1" /><text x="626" y="248" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0F172A">tok</text><text x="500" y="308" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#475569">Same single read, 4 tokens out:</text><text x="500" y="323" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#475569">4x the work for the same memory cost.</text><rect x="670" y="80" width="310" height="260" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" /><text x="825" y="106" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#0F172A">GPTQ-W8A16, 1 request</text><rect x="692" y="176" width="92" height="98" rx="6" fill="#34D399" stroke="none" stroke-width="1" /><text x="738" y="223.0" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#FFFFFF">INT8 weights</text><text x="738" y="239.0" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#FFFFFF">0.74 GiB</text><text x="738" y="292" font-size="11" font-weight="normal" text-anchor="middle" fill="#475569">GPU memory</text><line x1="790" y1="199" x2="842" y2="199" stroke="#0F172A" stroke-width="2.2" marker-end="url(#arrow-0F172A)"/><text x="816" y="190" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#475569">read</text><rect x="846" y="170" width="56" height="58" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="1" /><text x="874" y="196" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#6366F1">Compute</text><text x="874" y="211" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#6366F1">units</text><line x1="904" y1="199" x2="932" y2="199" stroke="#0F172A" stroke-width="1.4" marker-end="url(#arrow-0F172A)"/><rect x="934" y="188" width="34" height="22" rx="4" fill="#FCD34D" stroke="none" stroke-width="1" /><text x="951" y="203" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0F172A">tok</text><text x="825" y="308" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#475569">About half the bytes to read per step.</text><text x="825" y="323" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#475569">Measured: 9.25 -&gt; 6.76 ms per token.</text></svg>
