<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow-0F172A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#F8FAFC"/><line x1="0" y1="0" x2="0" y2="8" stroke="#CBD5E1" stroke-width="3"/></pattern></defs><rect width="1000" height="400" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><text x="500" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#0F172A">Prefix caching: compute a shared prompt once, reuse it</text><text x="500" y="58" font-size="13" font-weight="normal" text-anchor="middle" fill="#475569">If a new request starts with the same tokens as an earlier one, vLLM reuses those KV cache blocks instead of recomputing them.</text><text x="30" y="100" font-size="14.5" font-weight="bold" text-anchor="start" fill="#DC2626">Example 1: many users, same system prompt</text><text x="30" y="142" font-size="12.5" font-weight="bold" text-anchor="start" fill="#0F172A">User A</text><rect x="85" y="120" width="230" height="34" rx="6" fill="#FCD34D" stroke="#FFFFFF" stroke-width="2" /><text x="200.0" y="141.5" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0F172A">System prompt (shared)</text><rect x="318" y="120" width="150" height="34" rx="6" fill="#BFDBFE" stroke="#FFFFFF" stroke-width="2" /><text x="393.0" y="141.5" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0F172A">What are your hours?</text><text x="30" y="192" font-size="12.5" font-weight="bold" text-anchor="start" fill="#0F172A">User B</text><rect x="85" y="170" width="230" height="34" rx="6" fill="#34D399" stroke="#FFFFFF" stroke-width="2" /><text x="200.0" y="191.5" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0F172A">System prompt (shared)</text><rect x="318" y="170" width="150" height="34" rx="6" fill="#BFDBFE" stroke="#FFFFFF" stroke-width="2" /><text x="393.0" y="191.5" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0F172A">Do you ship abroad?</text><text x="30" y="242" font-size="12.5" font-weight="bold" text-anchor="start" fill="#0F172A">User C</text><rect x="85" y="220" width="230" height="34" rx="6" fill="#34D399" stroke="#FFFFFF" stroke-width="2" /><text x="200.0" y="241.5" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0F172A">System prompt (shared)</text><rect x="318" y="220" width="150" height="34" rx="6" fill="#BFDBFE" stroke="#FFFFFF" stroke-width="2" /><text x="393.0" y="241.5" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0F172A">How do I return an item?</text><text x="30" y="290" font-size="12.5" font-weight="normal" text-anchor="start" fill="#475569">User A's request computes the system prompt's KV cache.</text><text x="30" y="307" font-size="12.5" font-weight="normal" text-anchor="start" fill="#475569">Users B and C reuse it and only process their own question.</text><line x1="500" y1="90" x2="500" y2="330" stroke="#E2E8F0" stroke-width="2"/><text x="530" y="100" font-size="14.5" font-weight="bold" text-anchor="start" fill="#DC2626">Example 2: one user, multi-turn chat</text><text x="530" y="142" font-size="12.5" font-weight="bold" text-anchor="start" fill="#0F172A">Turn 1</text><rect x="590" y="120" width="90" height="34" rx="6" fill="#FCD34D" stroke="#FFFFFF" stroke-width="2" /><text x="635.0" y="141.5" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0F172A">System</text><rect x="683" y="120" width="70" height="34" rx="6" fill="#FCD34D" stroke="#FFFFFF" stroke-width="2" /><text x="718.0" y="141.5" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0F172A">Q1</text><rect x="756" y="120" width="110" height="34" rx="6" fill="#60A5FA" stroke="#FFFFFF" stroke-width="2" /><text x="811.0" y="141.5" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0F172A">Answer 1</text><text x="530" y="212" font-size="12.5" font-weight="bold" text-anchor="start" fill="#0F172A">Turn 2</text><rect x="590" y="190" width="90" height="34" rx="6" fill="#34D399" stroke="#FFFFFF" stroke-width="2" /><text x="635.0" y="211.5" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0F172A">System</text><rect x="683" y="190" width="70" height="34" rx="6" fill="#34D399" stroke="#FFFFFF" stroke-width="2" /><text x="718.0" y="211.5" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0F172A">Q1</text><rect x="756" y="190" width="110" height="34" rx="6" fill="#34D399" stroke="#FFFFFF" stroke-width="2" /><text x="811.0" y="211.5" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0F172A">Answer 1</text><rect x="869" y="190" width="96" height="34" rx="6" fill="#BFDBFE" stroke="#FFFFFF" stroke-width="2" /><text x="917.0" y="211.5" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0F172A">Q2 (new)</text><text x="530" y="290" font-size="12.5" font-weight="normal" text-anchor="start" fill="#475569">Turn 2 repeats the whole of turn 1 plus a new question.</text><text x="530" y="307" font-size="12.5" font-weight="normal" text-anchor="start" fill="#475569">Only the new question needs to be processed.</text><rect x="210" y="361" width="16" height="14" rx="3" fill="#FCD34D" stroke="none" stroke-width="1" /><text x="232" y="372" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">Computed (prefill)</text><rect x="382.8" y="361" width="16" height="14" rx="3" fill="#34D399" stroke="none" stroke-width="1" /><text x="404.8" y="372" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">Reused from prefix cache</text><rect x="595.2" y="361" width="16" height="14" rx="3" fill="#BFDBFE" stroke="none" stroke-width="1" /><text x="617.2" y="372" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">New tokens</text><rect x="715.2" y="361" width="16" height="14" rx="3" fill="#60A5FA" stroke="none" stroke-width="1" /><text x="737.2" y="372" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">Generated answer</text></svg>
